name: Purge expired media

on:
  workflow_dispatch:
  schedule:
    - cron: "45 12 * * *"

concurrency:
  group: purge-expired-media
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gh-pages
      - name: Remove media outside the recovery window
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          jq --arg now "$now" '[.[] | select(.purgeAfter >= $now)]' manifest.json > manifest.next.json
          jq -r --arg now "$now" '.[] | select(.purgeAfter < $now) | .publicPath' manifest.json | while IFS= read -r path; do
            if [[ ! "$path" =~ ^m/[a-f0-9]{16}/[a-zA-Z0-9._-]+$ ]]; then
              echo "Unsafe media path rejected"
              exit 1
            fi
            rm -f -- "$path"
          done
          mv manifest.next.json manifest.json
          find m -depth -type d -empty -delete 2>/dev/null || true
          git add --all
          if ! git diff --cached --quiet; then
            git -c user.name=turmadokako-bot -c user.email=actions@users.noreply.github.com commit -m "media: purge expired recovery files"
            git push origin HEAD:gh-pages
          fi
